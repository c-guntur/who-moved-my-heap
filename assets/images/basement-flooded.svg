<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 560' width='800' height='560' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- Caricature for 00_Index_01.adoc: a person on the basement stairs finds the basement flooded (heap objects afloat). -->
