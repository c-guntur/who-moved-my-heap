<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1400 330' width='1400' height='330' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5B6770'/></marker><linearGradient id='band' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#1B2A41'/><stop offset='1' stop-color='#2E4A6B'/></linearGradient></defs><rect width='1400' height='330' fill='#F5F7FA'/><text x='40' y='50' font-size='26' fill='#1F2933' font-weight='bold' text-anchor='start' >list.stream().filter(p).findFirst(): what one call allocates</text><text x='200' y='100' font-size='22' fill='#1F2933' font-weight='bold' text-anchor='middle' font-family='JetBrains Mono, Menlo, Consolas, monospace'>list.stream()</text><rect x='40' y='115' width='320' height='90' rx='8' fill='#E69F00'/><text x='200.0' y='154.5' font-size='22' fill='#1F2933' font-weight='bold' text-anchor='middle' >Head + Spliterator</text><text x='200.0' y='180.9' font-size='22' fill='#1F2933' font-weight='bold' text-anchor='middle' >80 B</text><text x='600' y='100' font-size='22' fill='#1F2933' font-weight='bold' text-anchor='middle' font-family='JetBrains Mono, Menlo, Consolas, monospace'>.filter(p)</text><rect x='440' y='115' width='320' height='90' rx='8' fill='#E69F00'/><text x='600.0' y='154.5' font-size='22' fill='#1F2933' font-weight='bold' text-anchor='middle' >StatelessOp + Sink</text><text x='600.0' y='180.9' font-size='22' fill='#1F2933' font-weight='bold' text-anchor='middle' >56 B + 16 B = 72 B</text><line x1='365' y1='160' x2='435' y2='160' stroke='#5B6770' stroke-width='2.5' marker-end='url(#arr)'/><text x='1000' y='100' font-size='22' fill='#1F2933' font-weight='bold' text-anchor='middle' font-family='JetBrains Mono, Menlo, Consolas, monospace'>.findFirst()</text><rect x='840' y='115' width='320' height='90' rx='8' fill='#E69F00'/><text x='1000.0' y='154.5' font-size='22' fill='#1F2933' font-weight='bold' text-anchor='middle' >FindSink + Optional</text><text x='1000.0' y='180.9' font-size='22' fill='#1F2933' font-weight='bold' text-anchor='middle' >32 B</text><line x1='765' y1='160' x2='835' y2='160' stroke='#5B6770' stroke-width='2.5' marker-end='url(#arr)'/><rect x='40' y='235' width='720' height='6' fill='#CC79A7'/><text x='40' y='275' font-size='20' fill='#CC79A7' font-weight='bold' text-anchor='start' >intermediate operations (lazy): only link a new stage</text><rect x='840' y='235' width='320' height='6' fill='#0072B2'/><text x='840' y='275' font-size='20' fill='#0072B2' font-weight='bold' text-anchor='start' >terminal (eager): runs it now</text><text x='40' y='312' font-size='20' fill='#5B6770' font-weight='normal' text-anchor='start' >+ captured lambda 16 B = 200 B per call.  The EC loop allocates 0 B.</text></svg>
