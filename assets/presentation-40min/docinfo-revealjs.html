<!-- Slide format for the reveal.js build (asciidoctor-revealjs): same colours and sizes as docinfo.html. -->
<style>
  .reveal { font-size: 30px; }
  .reveal .slides section { text-align: left; padding: 40px 70px; box-sizing: border-box; height: 100%; }
  .reveal .slides section.title { padding: 0; }
  .reveal section.title h1, .reveal .imageblock.title-slide { display: none; }
  .reveal h2 { font-size: 1.75em; color: #1B2A41; text-transform: none; border-left: 10px solid #E69F00;
      padding-left: .45em; margin-bottom: .6em; }
  .reveal .slides section.refs h2 { border-left-color: #0072B2; }
  .reveal .paragraph.footnote-line { margin-top: 1.2em; border-top: 1px solid #D5DCE3; padding-top: .4em; }
  .reveal .paragraph.footnote-line p { font-size: .55em; line-height: 1.45; color: #5B6B7C; text-align: left; }
  .reveal .lead p, .reveal p.lead { font-size: 1.15em; color: #2E4A6B; }
  .reveal ul { margin-left: 1em; }
  .reveal li { margin-bottom: .3em; }
  .reveal pre { font-size: .7em; width: 100%; box-shadow: none; }
  .reveal code { font-size: .92em; }
  .reveal .imageblock.diagram img { max-height: 380px; margin: 0; border: 1px solid #C9D2DC; border-radius: 8px;
      background: #fff; }
  .reveal .imageblock.screenshot img { max-height: 540px; margin: 0; border: 1px solid #C9D2DC; border-radius: 8px;
      background: #fff; }
  .reveal table { font-size: .8em; }
  .reveal .deck-nav { position: absolute; left: 70px; right: 70px; bottom: 30px; text-align: center; font-size: .7em;
      border-top: 1px solid #C9D2DC; padding-top: .5em; }
  .reveal .deck-nav a { color: #0072B2; }
  .reveal .slides section.cover h2 { font-size: 2.2em; }
  .reveal .ask { margin-top: 300px; text-align: center; }
  .reveal .ask p { font-size: 2.1em; line-height: 1.25; font-weight: 600; color: #1B2A41; }
  .reveal table.index-grid { font-size: .78em; width: 100%; }
  .reveal table.index-grid td:first-child { color: #8A96A3; font-weight: 600; }
  .reveal table.index-grid td:nth-child(2) a { font-weight: 600; color: #0072B2; }
  .reveal .ask-row > .content { display: flex; align-items: center; gap: 40px; margin-top: 90px; }
  .reveal .ask-row .ask { flex: 1; margin-top: 0; }
  .reveal .ask-row .imageblock.ask-art { flex: 0 0 48%; margin: 0; }
  .reveal .ask-row .imageblock.ask-art img { width: 100%; max-height: 440px; margin: 0; }
  .reveal table.cover-grid, .reveal table.cover-grid td { border: none; font-size: .9em; }
  .reveal .imageblock.cover-art img { max-height: 330px; margin: 0; }
  .reveal .imageblock.qr img { max-height: 250px; margin: 0; padding: 6px; background: #fff; border: 1px solid #C9D2DC;
      border-radius: 8px; }
  .reveal .disclaimer { position: absolute; left: 70px; right: 70px; bottom: 110px; text-align: center; font-size: .55em;
      color: #8A96A3; }
</style>
<!-- 40-minute deck additions: same section colours, track, demo and mind-map rules as docinfo.html. -->
<style>
  .reveal .sec-intro { --accent: #E25B5B; } .reveal .sec-problem { --accent: #EE8A45; } .reveal .sec-defs { --accent: #3FA779; }
  .reveal .sec-solutions { --accent: #1FA89B; } .reveal .sec-ai { --accent: #2B9BD6; } .reveal .sec-wrap { --accent: #E69F00; }

  .reveal .slides section.refs h2 { border-left-color: #0072B2; }

</style>
