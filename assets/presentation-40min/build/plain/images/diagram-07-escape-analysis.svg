<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1400 360' width='1400' height='360' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5B6770'/></marker><linearGradient id='band' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#1B2A41'/><stop offset='1' stop-color='#2E4A6B'/></linearGradient></defs><rect width='1400' height='360' fill='#F5F7FA'/><text x='40' y='50' font-size='24' fill='#1F2933' font-weight='bold' text-anchor='start' >After inlining, C2 asks: can anyone outside this method see the new object?</text><rect x='40' y='120' width='300' height='70' rx='8' fill='white' stroke='#C9D2DC' stroke-width='2'/><text x='190.0' y='162.7' font-size='22' fill='#1F2933' font-weight='normal' text-anchor='middle' font-family='JetBrains Mono, Menlo, Consolas, monospace'>new Object()</text><line x1='340' y1='155' x2='440' y2='115' stroke='#5B6770' stroke-width='2.5' marker-end='url(#arr)'/><line x1='340' y1='155' x2='440' y2='245' stroke='#5B6770' stroke-width='2.5' marker-end='url(#arr)'/><rect x='450' y='80' width='300' height='70' rx='8' fill='#0072B2'/><text x='600.0' y='122.7' font-size='22' fill='white' font-weight='bold' text-anchor='middle' >does not escape</text><line x1='750' y1='115' x2='830' y2='115' stroke='#5B6770' stroke-width='2.5' marker-end='url(#arr)'/><rect x='840' y='80' width='520' height='70' rx='8' fill='white' stroke='#0072B2' stroke-width='2'/><text x='1100.0' y='122.7' font-size='22' fill='#0072B2' font-weight='bold' text-anchor='middle' >scalar replaced: fields in registers, 0 B</text><rect x='450' y='210' width='300' height='70' rx='8' fill='#E69F00'/><text x='600.0' y='252.7' font-size='22' fill='#1F2933' font-weight='bold' text-anchor='middle' >escapes</text><line x1='750' y1='245' x2='830' y2='245' stroke='#5B6770' stroke-width='2.5' marker-end='url(#arr)'/><rect x='840' y='210' width='520' height='70' rx='8' fill='white' stroke='#E69F00' stroke-width='2'/><text x='1100.0' y='252.7' font-size='22' fill='#1F2933' font-weight='bold' text-anchor='middle' >allocated on the heap, collected by GC</text><text x='40' y='330' font-size='20' fill='#5B6770' font-weight='normal' text-anchor='start' >Escapes = stored in a field, returned, or passed to code that was not inlined.  Turn it off: -XX:-DoEscapeAnalysis</text></svg>
