<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1400 320' width='1400' height='320' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5B6770'/></marker><linearGradient id='band' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#1B2A41'/><stop offset='1' stop-color='#2E4A6B'/></linearGradient></defs><rect width='1400' height='320' fill='#F5F7FA'/><text x='40' y='50' font-size='26' fill='#1F2933' font-weight='bold' text-anchor='start' >Same question, two shapes of work</text><text x='40' y='110' font-size='22' fill='#0072B2' font-weight='bold' text-anchor='start' >eager steps</text><rect x='220' y='80' width='220' height='50' rx='8' fill='#0072B2'/><text x='330.0' y='111.3' font-size='18' fill='white' font-weight='bold' text-anchor='middle' >step 1: every element</text><rect x='500' y='80' width='220' height='50' rx='8' fill='white' stroke='#C9D2DC' stroke-width='2'/><text x='610.0' y='111.3' font-size='18' fill='#1F2933' font-weight='bold' text-anchor='middle' >new collection</text><line x1='445' y1='105' x2='495' y2='105' stroke='#5B6770' stroke-width='2.5' marker-end='url(#arr)'/><rect x='780' y='80' width='220' height='50' rx='8' fill='#0072B2'/><text x='890.0' y='111.3' font-size='18' fill='white' font-weight='bold' text-anchor='middle' >step 2: every element</text><line x1='725' y1='105' x2='775' y2='105' stroke='#5B6770' stroke-width='2.5' marker-end='url(#arr)'/><rect x='1060' y='80' width='220' height='50' rx='8' fill='white' stroke='#C9D2DC' stroke-width='2'/><text x='1170.0' y='111.3' font-size='18' fill='#1F2933' font-weight='bold' text-anchor='middle' >result</text><line x1='1005' y1='105' x2='1055' y2='105' stroke='#5B6770' stroke-width='2.5' marker-end='url(#arr)'/><text x='40' y='220' font-size='22' fill='#CC79A7' font-weight='bold' text-anchor='start' >lazy chain</text><rect x='220' y='190' width='220' height='50' rx='8' fill='white' stroke='#CC79A7' stroke-width='2' stroke-dasharray='8 6'/><text x='330.0' y='222.0' font-size='20' fill='#CC79A7' font-weight='bold' text-anchor='middle' >filter (recorded)</text><line x1='445' y1='215' x2='495' y2='215' stroke='#5B6770' stroke-width='2.5' stroke-dasharray='6 5' marker-end='url(#arr)'/><rect x='500' y='190' width='220' height='50' rx='8' fill='white' stroke='#CC79A7' stroke-width='2' stroke-dasharray='8 6'/><text x='610.0' y='222.0' font-size='20' fill='#CC79A7' font-weight='bold' text-anchor='middle' >map (recorded)</text><line x1='725' y1='215' x2='775' y2='215' stroke='#5B6770' stroke-width='2.5' stroke-dasharray='6 5' marker-end='url(#arr)'/><rect x='780' y='190' width='220' height='50' rx='8' fill='#0072B2'/><text x='890.0' y='222.0' font-size='20' fill='white' font-weight='bold' text-anchor='middle' >terminal op</text><line x1='1005' y1='215' x2='1055' y2='215' stroke='#5B6770' stroke-width='2.5' marker-end='url(#arr)'/><rect x='1060' y='190' width='220' height='50' rx='8' fill='white' stroke='#C9D2DC' stroke-width='2'/><text x='1170.0' y='221.3' font-size='18' fill='#1F2933' font-weight='bold' text-anchor='middle' >one element at a time</text><text x='220' y='290' font-size='20' fill='#5B6770' font-weight='normal' text-anchor='start' >Lazy steps do nothing until an eager terminal operation pulls elements through them.</text></svg>
